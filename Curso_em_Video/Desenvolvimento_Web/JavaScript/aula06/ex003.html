<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body{
            background-color: rgb(105, 105, 255);
            color: white;
            font: normal 20pt arial;
        }
        h1{
            color:yellow;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1> <!--Isto é um comentário-->
    <p>Já me livrei da maldição.</p>
    <script>
        var n1 = Number.parseInt(window.prompt('Digite um número: '))
        var n2 = Number.parseInt(window.prompt('Digite outro nome: '))
        var s = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é ${s}`) // Concatenação.
        // (n.number + n.number) para adição
        // (string + string) para concatenação
    </script>
</body>
</html>
